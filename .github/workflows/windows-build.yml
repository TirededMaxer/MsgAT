name: Windows Build (MsgAT portable single EXE)

on:
  push:
    branches: [ msgat-windows-build ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build fat JAR (with webrtc-java natives)
        working-directory: MsgAT_Windows
        run: ./gradlew.bat jar --no-daemon

      - name: jpackage - app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path appdir | Out-Null
          Copy-Item MsgAT_Windows/build/libs/MsgAT-Windows-*.jar appdir/
          jpackage --type app-image `
            --name MsgAT-Portable `
            --app-version 1.1.0 `
            --vendor "MsgAT Team" `
            --icon MsgAT_Windows/src/main/resources/icons/icon.ico `
            --input appdir `
            --main-jar (Get-ChildItem appdir/*.jar | Select-Object -First 1).Name `
            --main-class org.msgat.MainKt `
            --dest dist `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Dskiko.renderApi=DIRECT3D" `
            --java-options "-XX:+UseG1GC" `
            --java-options "-XX:+UseStringDeduplication" `
            --java-options "-Xmx2g"

      - name: Install 7-Zip (full installer, gets SFX modules)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2501-x64.exe" -OutFile "7zinst.exe"
          Start-Process -FilePath ".\7zinst.exe" -ArgumentList "/S","/D=C:\7z" -Wait
          if (-not (Test-Path "C:\7z\7z.exe")) { throw "7-Zip install failed" }
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/lzma2501.7z" -OutFile "lzma.7z"
          & "C:\7z\7z.exe" x -y "lzma.7z" "-oC:\7z\lzma" | Out-Null
          if (-not (Test-Path "C:\7z\lzma\bin\7zS2.sfx")) { throw "7zS2.sfx missing" }

      - name: Build SFX single EXE with proven pattern
        shell: pwsh
        run: |
          # Archive with 7zr (same decoder core as the stub) - flat root
          Push-Location "dist/MsgAT-Portable"
          & "C:\7z\lzma\bin\7zr.exe" a "..\msgat-app.7z" * | Out-Null
          Pop-Location
          if (-not (Test-Path "dist\msgat-app.7z")) { throw "archive missing" }

          # Config: UTF-8 no BOM, CRLF, trailing newline
          $cfg = ";!@Install@!UTF-8!`r`nTitle=`"MsgAT`"`r`nBeginPrompt=`"`"`r`nProgress=`"no`"`r`nRunProgram=`"MsgAT-Portable.exe`"`r`nGUIMode=`"2`"`r`n;!@InstallEnd@!`r`n"
          [System.IO.File]::WriteAllText("dist\config.txt", $cfg, [System.Text.UTF8Encoding]::new($false))

          # Concatenate stub + config + archive
          cmd /c "copy /b C:\7z\lzma\bin\7zS2.sfx + dist\config.txt + dist\msgat-app.7z dist\MsgAT-Portable.exe" | Out-Null
          if (-not (Test-Path "dist\MsgAT-Portable.exe")) { throw "concat failed" }

          # Sanity: 7z must be able to read the embedded archive of the final exe
          & "C:\7z\7z.exe" l "dist\MsgAT-Portable.exe" | Select-String -Pattern "MsgAT-Portable.cfg" | Select-Object -First 1 | ForEach-Object { "FINAL_EXE_CONTAINS_CFG: YES" }
          if (-not (Select-String -InputObject (& "C:\7z\7z.exe" l "dist\MsgAT-Portable.exe" | Out-String) -Pattern "MsgAT-Portable.cfg" -Quiet)) { "FINAL_EXE_CONTAINS_CFG: NO" }

          # Replace icon/metadata
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile "rcedit.exe"
          & .\rcedit.exe "dist\MsgAT-Portable.exe" `
            --set-icon "MsgAT_Windows\src\main\resources\icons\icon.ico" `
            --set-file-version "1.1.0.0" `
            --set-product-version "1.1.0.0" `
            --set-version-string "ProductName" "MsgAT" `
            --set-version-string "FileDescription" "MsgAT - Secure P2P Encrypted Messenger" `
            --set-version-string "CompanyName" "MsgAT Team"
          Get-Item "dist\MsgAT-Portable.exe" | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Smoke test - SFX must open the real app window (title check + screenshot)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "./dist/MsgAT-Portable.exe" -PassThru
          Start-Sleep -Seconds 30
          $alive = Get-Process -Name "MsgAT-Portable" -ErrorAction SilentlyContinue
          if (-not $alive) {
            "PACKED_EXE_CRASHED"
          } else {
            $title = $alive.MainWindowTitle
            "WINDOW_TITLE=[$title]"
            if ($title -match "无法|Error|入口|错误|InitCommonControls|7-Zip|Failed") {
              "PACKED_EXE_ERROR_DIALOG"
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("errshot.png", [System.Drawing.Imaging.ImageFormat]::Png)
              "ERR_SCREENSHOT_SAVED"
            } else {
              "PACKED_EXE_RUNNING_OK"
            }
          }
          Stop-Process -Name "MsgAT-Portable" -Force -ErrorAction SilentlyContinue

      - name: Upload error screenshot (when present)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: errshot
          path: errshot.png
          if-no-files-found: ignore

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: MsgAT-Portable-EXE
          path: dist/MsgAT-Portable.exe
          if-no-files-found: error
