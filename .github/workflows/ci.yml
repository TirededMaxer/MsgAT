name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - uses: ./.github/actions/native-security
        with:
          android: 'true'
      - name: Restore separate development signing when available
        env:
          ANDROID_DEVELOPMENT_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEVELOPMENT_KEYSTORE_BASE64 }}
          ANDROID_DEVELOPMENT_STORE_PASSWORD: ${{ secrets.ANDROID_DEVELOPMENT_STORE_PASSWORD }}
        run: python scripts/ci/packages.py restore-development-signing
      - working-directory: MsgAT
        env:
          ANDROID_DEVELOPMENT_STORE_PASSWORD: ${{ secrets.ANDROID_DEVELOPMENT_STORE_PASSWORD }}
        run: ./gradlew --no-build-cache --no-configuration-cache lintDebug assembleDebug
      - run: python scripts/ci/packages.py development-android
      - name: Remove temporary development signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/msgat-development-signing"
      - uses: actions/upload-artifact@v4
        with:
          name: development-android
          path: MsgAT/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/native-security
      - working-directory: MsgAT_Windows
        run: dotnet publish src/MsgAT.Windows/MsgAT.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Build isolated development app for actual-use acceptance
        working-directory: MsgAT_Windows
        run: dotnet publish src/MsgAT.Windows/MsgAT.Windows.csproj -c Debug --no-restore -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$env:RUNNER_TEMP/msgat-windows-development"
      - uses: actions/upload-artifact@v4
        with:
          name: development-windows
          path: ${{ runner.temp }}/msgat-windows-development/MsgAT.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-security
      - working-directory: MsgAT_macOS
        run: xcodebuild -project MsgAT.xcodeproj -scheme MsgAT -configuration Release -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/msgat-derived" -clonedSourcePackagesDirPath "$RUNNER_TEMP/msgat-packages" -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build
      - name: Link the same native core into the isolated debug apps
        run: |
          mkdir -p MsgAT_macOS/NativeSecurity/lib/Debug
          cp MsgAT_macOS/NativeSecurity/lib/Release/libmsgat_security_core.a MsgAT_macOS/NativeSecurity/lib/Debug/
      - working-directory: MsgAT_macOS
        run: xcodebuild -project MsgAT.xcodeproj -scheme MsgAT -configuration Debug -destination 'platform=macOS' -derivedDataPath "$RUNNER_TEMP/msgat-derived" -clonedSourcePackagesDirPath "$RUNNER_TEMP/msgat-packages" -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build
      - run: python scripts/ci/packages.py development-macos
      - uses: actions/upload-artifact@v4
        with:
          name: development-macos
          path: ${{ runner.temp }}/msgat-macos-development/MsgAT-macOS-development.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - working-directory: MsgAT_Console
        run: mvn --batch-mode package
      - uses: actions/upload-artifact@v4
        with:
          name: development-relay
          path: MsgAT_Console/target/*-obfuscated.jar
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
