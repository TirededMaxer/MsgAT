name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
      - uses: ./.github/actions/native-security
        with:
          android: 'true'
      - working-directory: MsgAT
        run: ./gradlew --no-build-cache --no-configuration-cache lintDebug assembleDebug

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: ./.github/actions/native-security
      - working-directory: MsgAT_Windows
        run: dotnet publish src/MsgAT.Windows/MsgAT.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true
      - name: Build isolated development app for actual-use acceptance
        working-directory: MsgAT_Windows
        run: dotnet publish src/MsgAT.Windows/MsgAT.Windows.csproj -c Debug --no-restore -r win-x64 --self-contained true -p:PublishSingleFile=true
      - uses: actions/upload-artifact@v4
        with:
          name: development-windows
          path: MsgAT_Windows/src/MsgAT.Windows/bin/Debug/net10.0-windows10.0.17763.0/win-x64/publish/MsgAT.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  macos:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-security
      - working-directory: MsgAT_macOS
        run: xcodebuild -project MsgAT.xcodeproj -scheme MsgAT -configuration Release -destination 'platform=macOS' -onlyUsePackageVersionsFromResolvedFile CODE_SIGNING_ALLOWED=NO build

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - working-directory: MsgAT_Console
        run: mvn --batch-mode package
