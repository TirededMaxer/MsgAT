<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>MsgAT WebRTC Host</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #101216; }
  video { display: none; background: #101216; }
  video.visible { display: block; }
  #remoteVideo { width: 100%; height: 100%; object-fit: contain; }
  #localVideo { position: absolute; bottom: 12px; right: 12px; width: 24%; max-width: 180px;
                aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; transform: scaleX(-1); }
</style></head>
<body>
<audio id="remoteAudio" autoplay></audio>
<video id="remoteVideo" autoplay playsinline muted></video>
<video id="localVideo" autoplay playsinline muted></video>
<script>
(() => {
  'use strict';
  let pc = null;
  let stream = null;
  let pendingMicrophone = null;
  let pendingOutput = null;
  let microphoneSender = null;
  let openingMicrophone = null;
  let microphoneMuted = false;
  let inputDevice = 'default';
  let capturedDefaultInput = null;
  let deviceRefreshTimer = null;
  let pendingCamera = null;
  let cameraTrack = null;
  let openingCameraTrack = null;
  let cameraSender = null;
  let cameraRevision = 0;
  let remoteTrack = null;
  let stopWatchingRemoteFrame = null;
  let pendingIce = [];
  let localIce = [];
  let descriptionSent = false;
  let commandQueue = Promise.resolve();
  let generation = 0;
  const remoteAudio = document.getElementById("remoteAudio");
  const remoteVideo = document.getElementById("remoteVideo");
  const localVideo = document.getElementById("localVideo");
  const post = (value, owner = generation) => {
    if (owner === generation) chrome.webview.postMessage({ ...value, generation: owner });
  };

  async function close() {
    clearTimeout(deviceRefreshTimer);
    deviceRefreshTimer = null;
    pendingIce = [];
    localIce = [];
    descriptionSent = false;
    remoteAudio.srcObject = null;
    remoteTrack = null;
    showRemoteVideo(null, generation);
    releaseCamera();
    cameraSender = null;
    microphoneSender = null;
    openingMicrophone?.stop();
    openingMicrophone = null;
    microphoneMuted = false;
    inputDevice = 'default';
    capturedDefaultInput = null;
    if (pc) { pc.ontrack = null; pc.onicecandidate = null; pc.onconnectionstatechange = null; pc.close(); pc = null; }
    if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
    if (pendingOutput) await pendingOutput.catch(() => {});
    if (remoteAudio.setSinkId) await remoteAudio.setSinkId('default').catch(() => {});
  }

  function microphoneConstraints(id) {
    return {
      deviceId: { exact: id }, echoCancellation: true, noiseSuppression: true, autoGainControl: true,
      channelCount: 1, sampleRate: 48000
    };
  }

  function captureNotice(kind, error, fallback) {
    switch (error?.name) {
      case 'NotAllowedError':
      case 'SecurityError':
        return kind + '-permission';
      case 'NotFoundError':
      case 'OverconstrainedError':
        return kind + '-unavailable';
      default:
        return fallback;
    }
  }

  function defaultInputGroup(devices) {
    return devices.find(device => device.kind === 'audioinput' && device.deviceId === 'default')?.groupId || null;
  }

  async function audioDevices(owner, notice, captureChanged = false) {
    if (!pc || owner !== generation) return;
    const devices = await navigator.mediaDevices.enumerateDevices().catch(() => []);
    if (!pc || owner !== generation) return;
    if (captureChanged) capturedDefaultInput = inputDevice === 'default' ? defaultInputGroup(devices) : null;
    const named = kind => devices.filter(device => device.kind === kind && device.deviceId &&
      device.deviceId !== 'default' && device.deviceId !== 'communications').slice(0, 32)
      .map((device, index) => ({ id: device.deviceId, name: device.label.slice(0, 160) || `Device ${index + 1}` }));
    post({ type: 'audio-devices', inputDevice, outputDevice: remoteAudio.sinkId || 'default',
      inputs: named('audioinput'), outputs: remoteAudio.setSinkId ? named('audiooutput') : [],
      canSelectOutput: typeof remoteAudio.setSinkId === 'function', notice }, owner);
  }

  function watchMicrophone(track, owner) {
    track.onended = () => {
      commandQueue = commandQueue.then(async () => {
        if (owner !== generation || microphoneSender?.track !== track || track.readyState !== 'ended') return;
        await switchMicrophone('default', owner, 'microphone-fallback');
      }).catch(() => {});
    };
  }

  async function switchMicrophone(id, owner, notice) {
    const connection = pc, sender = microphoneSender;
    if (!sender || !connection || owner !== generation) return;
    if (id !== 'default' && id === inputDevice && sender.track?.readyState === 'live') return;
    const current = () => owner === generation && pc === connection;
    let changed = false;
    const request = navigator.mediaDevices.getUserMedia({ audio: microphoneConstraints(id), video: false })
      .then(async captured => {
        const [track] = captured.getAudioTracks();
        if (!current()) { captured.getTracks().forEach(item => item.stop()); return; }
        if (!track) throw new DOMException('No microphone track', 'NotFoundError');
        const previous = sender.track;
        track.enabled = false;
        openingMicrophone = track;
        try { await sender.replaceTrack(track); }
        catch (error) { track.stop(); throw error; }
        finally { if (openingMicrophone === track) openingMicrophone = null; }
        if (!current()) { track.stop(); return; }
        if (previous) { stream.removeTrack(previous); previous.stop(); }
        stream.addTrack(track);
        track.enabled = !microphoneMuted;
        inputDevice = id;
        changed = true;
        watchMicrophone(track, owner);
      });
    pendingMicrophone = request;
    try { await request; }
    catch (error) { notice = captureNotice('microphone', error, 'microphone-switch-failed'); }
    finally { if (pendingMicrophone === request) pendingMicrophone = null; }
    if (current()) await audioDevices(owner, notice, changed);
  }

  async function switchOutput(id, owner, notice) {
    if (!pc || owner !== generation) return;
    if (!remoteAudio.setSinkId) { await audioDevices(owner, 'output-selection-unavailable'); return; }
    const request = remoteAudio.setSinkId(id);
    pendingOutput = request;
    try { await request; }
    catch { notice = 'output-switch-failed'; }
    finally { if (pendingOutput === request) pendingOutput = null; }
    await audioDevices(owner, notice);
  }

  navigator.mediaDevices?.addEventListener('devicechange', () => {
    if (!pc || !microphoneSender || deviceRefreshTimer !== null) return;
    const owner = generation;
    deviceRefreshTimer = setTimeout(() => {
      deviceRefreshTimer = null;
      commandQueue = commandQueue.then(async () => {
        if (!pc || owner !== generation) return;
        const devices = await navigator.mediaDevices.enumerateDevices().catch(() => null);
        if (!devices || owner !== generation) return;
        const inputLost = microphoneSender?.track?.readyState === 'ended' ||
          (inputDevice !== 'default' &&
            !devices.some(device => device.kind === 'audioinput' && device.deviceId === inputDevice));
        const systemInput = defaultInputGroup(devices);
        const defaultChanged = inputDevice === 'default' && capturedDefaultInput &&
          systemInput && systemInput !== capturedDefaultInput;
        if (inputLost) await switchMicrophone('default', owner, 'microphone-fallback');
        else if (defaultChanged) await switchMicrophone('default', owner);
        else if (inputDevice === 'default' && !capturedDefaultInput) capturedDefaultInput = systemInput;
        if (!pc || owner !== generation) return;
        const output = remoteAudio.sinkId;
        if (output && output !== 'default' && output !== 'communications' &&
            !devices.some(device => device.kind === 'audiooutput' && device.deviceId === output)) {
          await switchOutput('default', owner, 'output-fallback');
        } else if (!inputLost && !defaultChanged) await audioDevices(owner);
      }).catch(() => {});
    }, 150);
  });

  function showVideo(element, track) {
    element.srcObject = track ? new MediaStream([track]) : null;
    element.classList.toggle('visible', !!track);
    if (track) element.play().catch(() => {});
  }

  function showRemoteVideo(track, owner) {
    stopWatchingRemoteFrame?.();
    stopWatchingRemoteFrame = null;
    showVideo(remoteVideo, track);
    post({ type: 'remote-video', visible: false }, owner);
    if (!track) return;

    const source = remoteVideo.srcObject;
    const showFrame = () => {
      if (owner !== generation || remoteTrack !== track || remoteVideo.srcObject !== source) return;
      stopWatchingRemoteFrame = null;
      post({ type: 'remote-video', visible: true }, owner);
    };
    if (typeof remoteVideo.requestVideoFrameCallback === 'function') {
      const frame = remoteVideo.requestVideoFrameCallback(showFrame);
      stopWatchingRemoteFrame = () => remoteVideo.cancelVideoFrameCallback(frame);
    } else {
      remoteVideo.addEventListener('playing', showFrame, { once: true });
      stopWatchingRemoteFrame = () => remoteVideo.removeEventListener('playing', showFrame);
    }
  }

  function releaseCamera() {
    cameraRevision++;
    if (cameraTrack) cameraTrack.stop();
    if (openingCameraTrack) openingCameraTrack.stop();
    cameraTrack = null;
    openingCameraTrack = null;
    showVideo(localVideo, null);
  }

  async function cameraOff(owner) {
    releaseCamera();
    const revision = cameraRevision;
    const sender = cameraSender;
    if (sender?.track) await sender.replaceTrack(null).catch(() => {});
    if (revision === cameraRevision) post({ type: 'camera', enabled: false }, owner);
  }

  async function cameraOn(owner, switchDevice, revision) {
    const connection = pc, sender = cameraSender;
    const current = () => owner === generation && revision === cameraRevision && pc === connection;
    if (!current()) return;
    if (!sender) { post({ type: 'camera', enabled: false, notice: 'video-unavailable' }, owner); return; }
    let deviceId;
    try {
      if (switchDevice) {
        const devices = (await navigator.mediaDevices.enumerateDevices()).filter(device => device.kind === 'videoinput' && device.deviceId);
        if (!current()) return;
        if (devices.length < 2) {
          post({ type: 'camera', enabled: !!cameraTrack, notice: 'no-other-camera' }, owner);
          return;
        }
        const index = devices.findIndex(device => device.deviceId === cameraTrack?.getSettings().deviceId);
        deviceId = devices[(index + 1) % devices.length].deviceId;
      }
      const request = navigator.mediaDevices.getUserMedia({ audio: false, video: {
        ...(deviceId ? { deviceId: { exact: deviceId } } : {}),
        width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 24, max: 30 }
      }}).then(async captured => {
        const [track] = captured.getVideoTracks();
        if (!track || !current()) { captured.getTracks().forEach(item => item.stop()); return; }
        track.enabled = false;
        openingCameraTrack = track;
        try { await sender.replaceTrack(track); }
        catch (error) { track.stop(); throw error; }
        finally { if (openingCameraTrack === track) openingCameraTrack = null; }
        if (!current()) { track.stop(); return; }
        cameraTrack?.stop();
        cameraTrack = track;
        track.enabled = true;
        showVideo(localVideo, track);
        track.onended = () => { if (cameraTrack === track) void cameraOff(owner); };
        post({ type: 'camera', enabled: true }, owner);
      });
      pendingCamera = request;
      try { await request; }
      finally { if (pendingCamera === request) pendingCamera = null; }
    } catch (error) {
      if (current()) post({ type: 'camera', enabled: !!cameraTrack,
        notice: captureNotice('camera', error, 'camera-open-failed') }, owner);
    }
  }

  async function create(iceServers, owner, video, outgoing) {
    await close();
    if (owner !== generation) throw new Error('Call ended');
    const configuration = { iceServers, sdpSemantics: "unified-plan", bundlePolicy: "max-bundle", rtcpMuxPolicy: "require" };
    pc = new RTCPeerConnection(configuration);
    const connection = pc;
    pc.ontrack = event => {
      if (pc !== connection || owner !== generation) return;
      const track = event.track;
      if (track.kind === 'audio') {
        remoteAudio.srcObject = new MediaStream([track]);
        remoteAudio.play().catch(error => post({ type: 'state', state: 'failed', detail: String(error) }, owner));
      } else if (track.kind === 'video' && video) {
        remoteTrack = track;
        const current = () => pc === connection && owner === generation && remoteTrack === track;
        const update = () => { if (current()) showRemoteVideo(track.muted ? null : track, owner); };
        track.onmute = update;
        track.onunmute = update;
        track.onended = () => {
          if (!current()) return;
          remoteTrack = null;
          showRemoteVideo(null, owner);
        };
        update();
      }
    };
    pc.onicecandidate = event => {
      if (pc !== connection || !event.candidate) return;
      const candidate = { type: 'ice', sdpMid: event.candidate.sdpMid ?? '0',
        sdpMLineIndex: event.candidate.sdpMLineIndex ?? 0, candidate: event.candidate.candidate };
      if (descriptionSent) post(candidate, owner);
      else localIce.push(candidate);
    };
    pc.onconnectionstatechange = () => { if (pc === connection) post({ type: 'state', state: connection.connectionState }, owner); };
    const request = navigator.mediaDevices.getUserMedia({ audio: microphoneConstraints('default'), video: false })
      .catch(error => {
        throw Object.assign(new Error(error.name), {
          msgatReason: captureNotice('microphone', error, 'microphone-open-failed')
        });
      }).then(captured => {
      if (owner !== generation || pc !== connection) {
        captured.getTracks().forEach(track => track.stop());
        throw new Error('Call ended');
      }
      stream = captured;
      const [microphone] = stream.getAudioTracks();
      microphoneSender = connection.addTrack(microphone, stream);
      microphone.enabled = !microphoneMuted;
      watchMicrophone(microphone, owner);
      if (video && outgoing) cameraSender = connection.addTransceiver('video', { direction: 'sendrecv' }).sender;
    });
    pendingMicrophone = request;
    try {
      await request;
    } finally {
      if (pendingMicrophone === request) pendingMicrophone = null;
    }
    await audioDevices(owner, undefined, true);
  }

  async function publishDescription(type, owner) {
    const connection = pc;
    const sender = connection.getSenders().find(item => item.track && item.track.kind === 'audio');
    if (sender) {
      const parameters = sender.getParameters();
      if (parameters.encodings && parameters.encodings.length) {
        parameters.encodings.forEach(encoding => encoding.maxBitrate = 32000);
        await sender.setParameters(parameters);
      }
    }
    if (owner !== generation || pc !== connection) return;
    post({ type, sdp: connection.localDescription.sdp }, owner);
    descriptionSent = true;
    localIce.forEach(candidate => post(candidate, owner));
    localIce = [];
  }

  async function flushIce() {
    if (!pc || !pc.remoteDescription) return;
    const candidates = pendingIce.splice(0);
    for (const candidate of candidates) await addIce(candidate);
  }

  async function addIce(candidate) {
    try { await pc.addIceCandidate(candidate); }
    catch (error) { post({ type: 'ice-warning', detail: String(error) }); }
  }

  function optimizeOpus(sdp) {
    const lines = sdp.split(/\r?\n/);
    const mapping = lines.map(line => line.match(/^a=rtpmap:(\d+)\s+opus\/48000\/2/i)).find(Boolean);
    if (!mapping) return sdp;
    const pt = mapping[1];
    const audio = lines.findIndex(line => line.startsWith('m=audio '));
    if (audio >= 0) {
      const parts = lines[audio].split(' ');
      lines[audio] = [...parts.slice(0, 3), pt, ...parts.slice(3).filter(value => value !== pt)].join(' ');
    }
    const params = 'minptime=10;useinbandfec=1;usedtx=1;maxaveragebitrate=32000;stereo=0;sprop-maxcapturerate=16000';
    const keys = new Set(params.split(';').map(value => value.split('=')[0]));
    const prefix = `a=fmtp:${pt} `;
    const index = lines.findIndex(line => line.startsWith(prefix) || line === `a=fmtp:${pt}`);
    if (index >= 0) {
      const retained = lines[index].slice(prefix.length).split(';').map(value => value.trim()).filter(value => value && !keys.has(value.split('=')[0].toLowerCase()));
      lines[index] = prefix + [params, ...retained].join(';');
    } else {
      const position = lines.findIndex(line => line.startsWith(`a=rtpmap:${pt} `));
      if (position >= 0) lines.splice(position + 1, 0, prefix + params);
    }
    return lines.join('\r\n');
  }

  async function execute(command) {
      const p = command.payload;
      const owner = command.generation;
      const current = () => { if (owner !== generation) throw new Error('Call ended'); };
      try {
        current();
        if (command.type === 'offer') {
          await create(p.iceServers, owner, p.video, true);
          current();
          const offer = await pc.createOffer({ offerToReceiveAudio: true });
          current();
          await pc.setLocalDescription({ type: offer.type, sdp: optimizeOpus(offer.sdp) });
          current();
          await publishDescription('offer', owner);
        } else if (command.type === 'accept') {
          await create(p.iceServers, owner, p.video, false);
          current();
          await pc.setRemoteDescription({ type: 'offer', sdp: optimizeOpus(p.sdp) });
          current();
          if (p.video) {
            const video = pc.getTransceivers().find(item => item.mid !== null && item.receiver.track.kind === 'video');
            if (!video) throw new Error('Video could not be negotiated');
            video.direction = 'sendrecv';
            cameraSender = video.sender;
          }
          await flushIce();
          current();
          const answer = await pc.createAnswer();
          current();
          await pc.setLocalDescription({ type: answer.type, sdp: optimizeOpus(answer.sdp) });
          current();
          await publishDescription('answer', owner);
        } else if (command.type === 'answer') {
          await pc.setRemoteDescription({ type: 'answer', sdp: optimizeOpus(p.sdp) });
          current();
          await flushIce();
        } else if (command.type === 'ice') {
          const candidate = { sdpMid: p.sdpMid, sdpMLineIndex: p.sdpMLineIndex, candidate: p.candidate };
          if (pc && pc.remoteDescription) await addIce(candidate);
          else if (pendingIce.length < 256) pendingIce.push(candidate);
        } else if (command.type === 'mute') {
          microphoneMuted = p.muted;
          if (stream) stream.getAudioTracks().forEach(track => track.enabled = !microphoneMuted);
        } else if (command.type === 'audio-input') {
          await switchMicrophone(p.id, owner);
        } else if (command.type === 'audio-output') {
          await switchOutput(p.id, owner);
        } else if (command.type === 'camera') {
          await cameraOn(owner, p.switchDevice, command.cameraRevision);
        } else if (command.type === 'stats') {
          let value = null;
          if (pc) {
            const stats = await pc.getStats();
            stats.forEach(report => {
              let seconds = null;
              if (report.type === 'candidate-pair' && report.state === 'succeeded') {
                seconds = report.currentRoundTripTime ?? report.roundTripTime;
              } else if (report.type === 'remote-inbound-rtp') {
                seconds = report.roundTripTime;
              }
              const ms = Math.trunc(seconds * 1000);
              if (typeof seconds === 'number' && Number.isFinite(ms) && ms > 0 && (value === null || ms < value)) value = ms;
            });
          }
          if (value !== null) post({ type: 'rtt', value }, owner);
        } else if (command.type === 'close') {
          await close();
        }
      } catch (error) {
        const reason = error.msgatReason ?? null;
        post({ type: 'state', state: 'failed', reason, detail: String(error) }, owner);
      }
  }
  window.msgat = {
    command: command => {
      if (command.generation < generation) return;
      if (command.type === 'close') {
        const owner = generation = command.generation;
        const pending = [pendingMicrophone, pendingCamera].filter(Boolean);
        commandQueue = Promise.resolve();
        return close().then(() => Promise.allSettled(pending))
          .then(() => post({ type: 'media-released' }, owner));
      }
      if (command.type === 'camera') {
        if (command.generation !== generation) return;
        if (!command.payload.enabled) return cameraOff(generation);
        command.cameraRevision = ++cameraRevision;
      }
      if (command.type === 'offer' || command.type === 'accept') generation = command.generation;
      commandQueue = commandQueue.then(() => execute(command));
      return commandQueue;
    }
  };
  post({ type: 'ready' });
})();
</script>
</body>
</html>
