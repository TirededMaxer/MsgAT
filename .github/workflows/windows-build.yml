name: Windows Build (MsgAT portable single EXE)

on:
  push:
    branches: [ msgat-windows-build ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Build fat JAR (with webrtc-java natives)
        working-directory: MsgAT_Windows
        run: ./gradlew.bat jar --no-daemon

      - name: jpackage - app image
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path appdir | Out-Null
          Copy-Item MsgAT_Windows/build/libs/MsgAT-Windows-*.jar appdir/
          jpackage --type app-image `
            --name MsgAT-Portable `
            --app-version 1.1.0 `
            --vendor "MsgAT Team" `
            --icon MsgAT_Windows/src/main/resources/icons/icon.ico `
            --input appdir `
            --main-jar (Get-ChildItem appdir/*.jar | Select-Object -First 1).Name `
            --main-class org.msgat.MainKt `
            --dest dist `
            --java-options "-Dfile.encoding=UTF-8" `
            --java-options "-Dskiko.renderApi=DIRECT3D" `
            --java-options "-XX:+UseG1GC" `
            --java-options "-XX:+UseStringDeduplication" `
            --java-options "-Xmx2g"

      - name: Install 7-Zip (full installer, gets SFX modules)
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/7z2501-x64.exe" -OutFile "7zinst.exe"
          Start-Process -FilePath ".\7zinst.exe" -ArgumentList "/S","/D=C:\7z" -Wait
          if (-not (Test-Path "C:\7z\7z.exe")) { throw "7-Zip install failed" }
          Invoke-WebRequest -Uri "https://www.7-zip.org/a/lzma2501.7z" -OutFile "lzma.7z"
          & "C:\7z\7z.exe" x -y "lzma.7z" "-oC:\7z\lzma" | Out-Null
          if (-not (Test-Path "C:\7z\lzma\bin\7zS2.sfx")) { throw "7zS2.sfx missing" }

      - name: Build portable single EXE with NSIS
        shell: pwsh
        run: |
          choco install nsis -y | Out-Null
          $nsis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { $nsis = "C:\Program Files\NSIS\makensis.exe" }
          if (-not (Test-Path $nsis)) { throw "makensis.exe not found" }
          & $nsis /V2 "portable.nsi"
          if (-not (Test-Path "dist\MsgAT-Portable.exe")) { throw "NSIS build failed - no output" }
          Get-Item "dist\MsgAT-Portable.exe" | Select-Object Name, @{n='SizeMB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Control - run app-image directly (no wrapper)
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "./dist/MsgAT-Portable/MsgAT-Portable.exe" -PassThru
          Start-Sleep -Seconds 30
          $procs = Get-Process -Name "MsgAT-Portable" -ErrorAction SilentlyContinue
          Write-Host ("CONTROL_COUNT=" + @($procs).Count)
          foreach ($pr in @($procs)) { Write-Host ("CONTROL_PROC: " + $pr.Id + " title=[" + $pr.MainWindowTitle + "]") }
          Stop-Process -Name "MsgAT-Portable" -Force -ErrorAction SilentlyContinue

      - name: Smoke test - portable EXE must open the real app window
        shell: pwsh
        continue-on-error: true
        run: |
          $p = Start-Process -FilePath "./dist/MsgAT-Portable.exe" -PassThru
          Start-Sleep -Seconds 60
          $procs = Get-Process -Name "MsgAT-Portable" -ErrorAction SilentlyContinue
          Write-Host ("PROCESS_COUNT=" + @($procs).Count)
          $ok = $false
          $err = $false
          foreach ($pr in @($procs)) {
            $t = $pr.MainWindowTitle
            Write-Host ("PROC: " + $pr.Id + " title=[" + $t + "]")
            if ($t -match "无法|Error|入口|错误|InitCommonControls|7-Zip|Failed") { $err = $true }
            if ($t -match "MsgAT$") { $ok = $true }
          }
          if ($ok) { "PACKED_EXE_RUNNING_OK" }
          elseif ($err) { "PACKED_EXE_ERROR_DIALOG" }
          else { "PACKED_EXE_AMBIGUOUS" }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap($b.Width, $b.Height)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          $bmp.Save("shot.png", [System.Drawing.Imaging.ImageFormat]::Png)
          Copy-Item "shot.png" "errshot.png" -Force
          "SHOT_SAVED"
          Stop-Process -Name "MsgAT-Portable" -Force -ErrorAction SilentlyContinue
          if (Test-Path "$env:TEMP\nsis-paths.txt") { "NSIS_PATHS:"; Get-Content "$env:TEMP\nsis-paths.txt" }
          if (Test-Path "$env:TEMP\MsgATPortable\app\MsgAT-Portable.cfg") { "CFG_PRESENT: YES" } else { "CFG_PRESENT: NO" }

      - name: Upload error screenshot (when present)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: errshot
          path: errshot.png
          if-no-files-found: ignore

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: MsgAT-Portable-EXE
          path: dist/MsgAT-Portable.exe
          if-no-files-found: error
