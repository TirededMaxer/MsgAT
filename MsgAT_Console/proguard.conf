-dontwarn **
-ignorewarnings
-dontnote
-dontoptimize
-dontshrink
-dontpreverify

# Keep annotations so Netty's @Sharable works on ChannelInitializer
-keepattributes *Annotation*,Signature,InnerClasses,EnclosingMethod

# Keep the main class
-keep public class org.msgat.console.Main {
    public static void main(java.lang.String[]);
}

# Keep Netty handlers since they are instantiated or used reflectively
-keep class io.netty.** { *; }

# Keep BouncyCastle
-keep class org.bouncycastle.** { *; }

# Keep SLF4J and Logback
-keep class org.slf4j.** { *; }
-keep class ch.qos.logback.** { *; }

# Keep Gson
-keep class com.google.gson.** { *; }
-keepclassmembers class * {
    @com.google.gson.annotations.SerializedName <fields>;
}

# Keep SQLite JDBC
-keep class org.sqlite.** { *; }

# We want to obfuscate org.msgat.console.core.CryptoUtils and other internal logic,
# but we need to keep the entry points that might be accessed by reflection,
# or in this case, it's just a standard console app so ProGuard will obfuscate 
# CryptoUtils since it's only called directly.

# Keep DatabaseManager's UserProfile fields so Gson or other things don't break if they use reflection
-keep class org.msgat.console.db.DatabaseManager$UserProfile { *; }
